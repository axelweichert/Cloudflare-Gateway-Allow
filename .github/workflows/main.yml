name: Add Rules to Cloudflare Gateway
on:
  push:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

# Serialize sync runs. Never cancel a run mid-write: a cancelled run leaves the
# CF list partially mutated and the Actions cache un-uploaded, which desyncs
# cache↔CF and triggers the "item to be removed … not found in list" 400.
concurrency:
  group: cf-gateway-sync
  cancel-in-progress: false

jobs:
  run:
    name: Cloudflare Gateway
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_IDENTIFIER: ${{ secrets.CF_IDENTIFIER }}
      WHITELIST_URLS: ${{ vars.WHITELIST_URLS }}
      DYNAMIC_WHITELIST: ${{ vars.DYNAMIC_WHITELIST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          
      - name: Install Python
        uses: actions/setup-python@main
        with:
          python-version: 3.11
        
      - name: Cache Data
        id: cache-cloudflare
        uses: actions/cache@main
        with:
          path: cloudflare_cache.json
          key: ${{ runner.os }}-cloudflare-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cloudflare-cache-
      
      - name: Cloudflare Gateway Zero Trust 
        run: python -m src run
